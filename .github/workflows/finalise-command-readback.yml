name: Finalise command readback

on:
  push:
    branches:
      - fix/command-readback-confirmation
    paths:
      - .github/workflows/finalise-command-readback.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("thermowatt-heater/thermowatt_bridge.py")
          text = path.read_text()

          old = '''        self.current_poll_interval = self.POLL_INTERVAL_CONFIRM
        self._poll_wakeup.set()

        if field is not None:
'''
          new = '''        self.current_poll_interval = self.POLL_INTERVAL_CONFIRM

        if field is not None:
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            self._publish_diagnostics(serial)

        print(
'''
          new = '''            self._publish_diagnostics(serial)

        # Wake only after the confirmation record exists, so a prompt poll cannot
        # race ahead of the expectation it is meant to reconcile.
        self._poll_wakeup.set()

        print(
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                "value_template":           "{{ value_json.command_status }}",
                "json_attributes_topic":    diag_topic,
                "json_attributes_template": "{{ value_json.commands | tojson }}",
'''
          new = '''                "value_template":           "{{ value_json.command_status | default('idle') }}",
                "json_attributes_topic":    diag_topic,
                "json_attributes_template": "{{ value_json.commands | default({}) | tojson }}",
'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests_path = Path("thermowatt-heater/tests/test_command_confirmation.py")
          tests = tests_path.read_text()
          old = '''        assert payload["json_attributes_topic"] == "P/SN/diagnostics"
'''
          new = '''        assert payload["json_attributes_topic"] == "P/SN/diagnostics"
        assert "default('idle')" in payload["value_template"]
        assert "default({})" in payload["json_attributes_template"]
'''
          assert old in tests
          tests_path.write_text(tests.replace(old, new, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest paho-mqtt requests urllib3
          python -m py_compile thermowatt-heater/thermowatt_bridge.py thermowatt-heater/tests/test_bridge.py thermowatt-heater/tests/test_command_confirmation.py
          PYTHONPATH=thermowatt-heater python -m pytest -q thermowatt-heater/tests
          git diff --check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalise-command-readback.yml
          git add thermowatt-heater/thermowatt_bridge.py thermowatt-heater/tests/test_command_confirmation.py
          git commit -m "fix(bridge): close confirmation wake race"
          git push origin HEAD:refs/heads/fix/command-readback-confirmation
