name: PR 6 validation

on:
  push:
    branches:
      - fix/command-readback-confirmation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thermowatt-heater
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install
          "paho-mqtt>=2.1,<3"
          "requests>=2.31,<3"
          "urllib3>=2,<3"
          "pytest>=7"

      - name: Compile Python
        run: python -m py_compile thermowatt_bridge.py tests/test_bridge.py tests/test_command_confirmation.py

      - name: Run full repository tests
        run: pytest -q

      - name: Check diff whitespace
        working-directory: .
        run: git diff --check origin/main...HEAD
